# A ~2.8k-pair slice of configs/data.yaml for the proof run. Cache it into the main
# cache (`irisedit cache data_proof --out data/cache_main`) so the full run resumes from it.
size: 768
sources:
- repo: osunlp/MagicBrush
  split: train
  src: source_img
  tgt: target_img
  instr: instruction
  count: 600
  prefix: magicbrush
- repo: TIGER-Lab/OmniEdit-Filtered-1.2M
  split: train
  src: src_img
  tgt: edited_img
  instr: edited_prompt_list
  count: 1200
  score_field: o_score
  min_score: 8.0
  prefix: omniedit
- repo: iitolstykh/NHR-Edit
  split: train
  src: source_image
  tgt: edited_image
  instr: edit_instruction
  count: 400
  balance_field: category
  max_per_type: 400
  prefix: nhr
- repo: UCSC-VLAA/HQ-Edit
  split: train
  src: input_image
  tgt: output_image
  instr: edit
  count: 600
  prefix: hqedit
